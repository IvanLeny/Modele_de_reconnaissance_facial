[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rag_minpmeesa"
version = "1.0.0"
description = "Système RAG hybride pour le patrimoine documentaire du MINPMEESA (mémoire M2, ISSEA-CEMAC)."
readme = "readme.md"
requires-python = ">=3.9"
authors = [{ name = "Adnane MAMA IDISSA" }]
dependencies = [
    "pymupdf>=1.24",
    "rank-bm25>=0.2.2",
    "scikit-learn>=1.3",
    "numpy>=1.24",
    "streamlit>=1.30",
]

[project.optional-dependencies]
# Configuration de référence (déploiement local souverain).
transformer = ["fastembed>=0.3"]
dev = ["pytest>=7.0"]

[project.scripts]
rag-minpmeesa = "rag_minpmeesa.app.cli:main"

[tool.setuptools.packages.find]
include = ["rag_minpmeesa*"]
